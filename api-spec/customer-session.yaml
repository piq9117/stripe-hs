          maxLength: 5000
          description: Unique identifier for the object.
        currency:
          type: string
          maxLength: 5000
          description: Three-letter [ISO code for the currency](https://stripe.com/docs/currencies) the customer can be charged in for recurring billing purposes.
        sources:
          type: object
